{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Users 👤
</h1>

<div class="space-y-4">

    {% for user in users %}
        <div class="bg-gray-800 p-4 rounded-xl flex justify-between items-center">

            <div>
                <p class="font-semibold">{{ user.username }}</p>
                <p class="text-sm text-gray-400">{{ user.email }}</p>
            </div>

            <span class="text-xs px-2 py-1 rounded 
                {% if user.is_staff %}bg-green-500{% else %}bg-gray-600{% endif %}">
                {% if user.is_staff %}Admin{% else %}User{% endif %}
            </span>

        </div>
    {% endfor %}

</div>

{% endblock %}
