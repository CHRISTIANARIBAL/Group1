{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Lessons by Subjects 📚
</h1>

<div class="grid md:grid-cols-3 gap-6">

    {% for course in courses %}
        <a href="{% url 'admin_course_lessons' course.id %}">
            <div class="bg-gray-800 p-6 rounded-xl shadow-lg hover:scale-105 transition cursor-pointer">

                <h2 class="text-xl font-semibold mb-2">
                    {{ course.title }}
                </h2>

                <p class="text-gray-400 text-sm">
                    Click to manage lessons →
                </p>

            </div>
        </a>
    {% endfor %}

</div>

{% endblock %}
