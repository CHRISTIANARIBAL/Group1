{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Manage Course
</h1>

<form method="POST" class="bg-gray-800 p-6 rounded-xl space-y-5 shadow-lg">
    {% csrf_token %}

    <!-- Title -->
    <div>
        <label class="block text-gray-400 mb-1">Course Title</label>
        <input type="text" name="title" value="{{ form.title.value|default:'' }}"
               class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-primary">
    </div>

    <!-- Description -->
    <div>
        <label class="block text-gray-400 mb-1">Description</label>
        <textarea name="description" rows="4"
                  class="w-full p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-primary">{{ form.description.value|default:'' }}</textarea>
    </div>

    <!-- Buttons -->
    <div class="flex justify-between items-center pt-4">

        <a href="{% url 'admin_courses' %}"
           class="text-gray-400 hover:text-white transition">
            ← Back
        </a>

        <button type="submit"
            class="bg-primary px-6 py-2 rounded-lg font-semibold hover:bg-indigo-500 transition shadow-md hover:shadow-indigo-500/30">
            Save
        </button>

    </div>

</form>

{% endblock %}
