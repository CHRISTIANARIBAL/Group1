{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Manage Quizzes 🧠
</h1>

<div class="grid md:grid-cols-3 gap-4">

{% for course in courses %}
    <a href="{% url 'admin_course_quiz' course.id %}"
       class="bg-gray-800 p-4 rounded-lg hover:scale-105 transition">
        {{ course.title }}
    </a>
{% endfor %}

</div>

{% endblock %}
