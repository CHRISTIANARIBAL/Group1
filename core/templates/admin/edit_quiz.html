{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Edit Quiz 🧠
</h1>

<!-- QUIZ TITLE -->
<form method="POST" class="mb-6">
    {% csrf_token %}

    <input type="text" name="title" value="{{ quiz.title }}"
        class="w-full p-3 bg-gray-800 rounded mb-3">

    <button class="bg-primary px-6 py-2 rounded">
        Update Title
    </button>
</form>

<hr class="border-gray-700 mb-6">

<!-- QUESTIONS -->
<div class="space-y-4">

{% for q in questions %}
    <div class="bg-gray-800 p-4 rounded-lg">

        <p class="font-bold mb-2">
            {{ q.text }}
        </p>

        <!-- CHOICES -->
        <ul class="ml-4 space-y-1">
        {% for c in q.choice_set.all %}
            <li class="{% if c.is_correct %}text-green-400{% endif %}">
                • {{ c.text }}
            </li>
        {% endfor %}
        </ul>

        <!-- ACTIONS -->
        <div class="mt-3 flex gap-3">

            <a href="{% url 'admin_edit_question' q.id %}"
               class="text-sm bg-yellow-500 px-3 py-1 rounded">
                Edit
            </a>

            <a href="{% url 'admin_delete_question' q.id %}"
               class="text-sm bg-red-500 px-3 py-1 rounded">
                Delete
            </a>

        </div>

    </div>
{% empty %}
    <p class="text-gray-400">No questions yet.</p>
{% endfor %}

</div>

<!-- ADD QUESTION -->
<div class="mt-6">
    <a href="{% url 'admin_add_question' quiz.id %}"
       class="bg-green-500 px-4 py-2 rounded">
        ➕ Add Question
    </a>
</div>

{% endblock %}
