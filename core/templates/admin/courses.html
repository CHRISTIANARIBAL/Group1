{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">Courses</h1>

<a href="{% url 'admin_add_course' %}"
   class="bg-primary px-4 py-2 rounded-lg mb-4 inline-block">
   ➕ Add Subjects
</a>

<div class="space-y-4">

    {% for course in courses %}
        <div class="bg-gray-800 p-4 rounded-xl flex justify-between items-center">

            <div>
                <h2 class="font-semibold">{{ course.title }}</h2>
                <p class="text-gray-400 text-sm">{{ course.description }}</p>
            </div>

            <div class="flex gap-2">

                <a href="{% url 'admin_edit_course' course.id %}"
                   class="bg-yellow-500 px-3 py-1 rounded">
                   Edit
                </a>

                <a href="{% url 'admin_delete_course' course.id %}"
                   class="bg-red-500 px-3 py-1 rounded">
                   Delete
                </a>

            </div>

        </div>
    {% endfor %}

</div>

{% endblock %}
