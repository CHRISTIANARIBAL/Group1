{% extends 'admin/admin_base.html' %}

{% block content %}

<h1 class="text-2xl font-bold text-primary mb-6">
    Create Quiz (All-in-One) 🧠
</h1>

<form method="POST" class="space-y-6">
{% csrf_token %}

<!-- QUIZ TITLE -->
<input type="text" name="title"
       value="{{ activity.title|default:'' }}"

<div id="questions"></div>

<button type="button" onclick="addQuestion()"
    class="bg-green-500 px-4 py-2 rounded">
    ➕ Add Question
</button>

<!-- SAVE -->
<div>
    <button class="bg-primary px-6 py-3 rounded-lg">
        Save Quiz
    </button>
</div>

</form>

<!-- JS -->
<script>
let qIndex = 0;

function addQuestion() {
    const container = document.getElementById('questions');

    const qHTML = `
    <div class="bg-gray-800 p-4 rounded-lg mt-4">
        <input type="text" name="question[]" placeholder="Question"
            class="w-full p-2 bg-gray-700 rounded mb-3">

        <div id="choices-${qIndex}"></div>

        <button type="button" onclick="addChoice(${qIndex})"
            class="bg-blue-500 px-3 py-1 rounded">
            + Choice
        </button>
    </div>
    `;

    container.insertAdjacentHTML('beforeend', qHTML);

    addChoice(qIndex);
    addChoice(qIndex);
    qIndex++;
}

function addChoice(q) {
    const container = document.getElementById(`choices-${q}`);

    const count = container.children.length;

    const cHTML = `
    <div class="flex items-center gap-2 mt-2">
        <input type="radio" name="correct_${q}" value="${count}">
        <input type="text" name="choice_${q}[]" placeholder="Choice"
            class="flex-1 p-2 bg-gray-700 rounded">
    </div>
    `;

    container.insertAdjacentHTML('beforeend', cHTML);
}

addQuestion();
</script>

{% endblock %}
