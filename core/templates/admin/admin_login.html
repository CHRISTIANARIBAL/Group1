<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - EduFlow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-md">

        <h2 class="text-2xl font-bold mb-6 text-center text-primary">
            Admin Login ⚙️
        </h2>

        {% if error %}
            <div class="bg-red-500 text-white p-2 rounded mb-4 text-sm text-center">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block mb-1 text-gray-400">Username</label>
                <input type="text" name="username"
                    class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-primary">
            </div>

            <div class="mb-6">
                <label class="block mb-1 text-gray-400">Password</label>
                <input type="password" name="password"
                    class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-primary">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-indigo-500 transition p-3 rounded-lg font-semibold">
                Login as Admin
            </button>
        </form>

        <div class="mt-4 text-center text-gray-400 text-sm">
            <a href="{% url 'login' %}" class="hover:text-primary">
                ← Back to User Login
            </a>
        </div>

    </div>

</body>
</html>
