{% extends 'base.html' %}

{% block content %}

<div class="flex items-center justify-center min-h-[80vh]">

    <div class="bg-gray-800 p-8 rounded-2xl shadow-lg w-full max-w-md">

        <h2 class="text-2xl font-bold mb-6 text-center text-primary">
            Welcome Back 👋
        </h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block mb-1 text-gray-400">Username</label>
                <input type="text" name="username"
                    class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-primary">
            </div>

            <div class="mb-6">
                <label class="block mb-1 text-gray-400">Password</label>
                <input type="password" name="password"
                    class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-primary">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-indigo-500 transition p-3 rounded-lg font-semibold">
                Login
            </button>
        </form>

        <div class="mt-6 text-center text-gray-400">
    Don’t have an account?
    <a href="{% url 'register' %}" class="text-primary hover:underline">
        Register
    </a>
</div>
<div class="mt-3 text-center text-gray-500 text-sm">
    <a href="{% url 'admin_login' %}" class="hover:text-primary transition">
        Admin Login ⚙️
    </a>
</div>

    </div>

</div>

{% endblock %}
