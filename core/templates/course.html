{% extends 'base.html' %}

{% block content %}

<!-- 🔝 Top Navigation -->
<div class="flex justify-between items-center mb-8">

    <!-- Back -->
    <button onclick="history.back()"
        class="flex items-center gap-2 text-gray-400 hover:text-white transition">
        <span class="text-xl">←</span>
        <span class="text-sm hidden sm:inline">Back</span>
    </button>

    <!-- Course Shortcut -->
    <a href="{% url 'lessons' %}"
       class="text-sm bg-gray-700 px-4 py-2 rounded-lg hover:bg-gray-600 transition">
        📚 All Courses
    </a>

    <!-- Next -->
    {% if next_lesson %}
        <a href="{% url 'lesson_detail' next_lesson.id %}"
           class="flex items-center gap-2 text-gray-400 hover:text-white transition">
            <span class="text-sm hidden sm:inline">Next</span>
            <span class="text-xl">→</span>
        </a>
    {% else %}
        <div></div>
    {% endif %}

</div>

<!-- 🌟 Title Section -->
<div class="text-center mb-12 relative">

    <!-- Glow -->
    <div class="absolute inset-0 flex justify-center">
        <div class="w-64 h-64 bg-primary opacity-20 blur-3xl rounded-full"></div>
    </div>

    <h1 class="relative text-3xl md:text-4xl font-extrabold text-primary">
        {{ course.title }}
    </h1>

</div>

<!-- 📦 Lesson Grid -->
<div class="grid sm:grid-cols-2 md:grid-cols-3 gap-6 max-w-5xl mx-auto">

    {% for item in lesson_data %}
        <a href="{% url 'lesson_detail' item.lesson.id %}">
            <div class="bg-gray-800 p-6 rounded-2xl shadow-md hover:scale-105 hover:bg-gray-700 transition cursor-pointer group">

                <h2 class="text-lg font-semibold mb-2 group-hover:text-primary transition">
                    {{ item.lesson.title }}
                </h2>

                <p class="text-sm text-gray-400">
                    Click to Learn this lesson →
                </p>

            </div>
        </a>
    {% endfor %}

</div>

{% endblock %}
